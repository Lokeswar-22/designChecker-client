<div class="login-container">
  <div class="login-background">
    <div class="background-pattern"></div>
  </div>
  
  <div class="login-card">
    <div class="login-header">
      <div class="logo-section">
        <div class="logo-icon">
          <img src="assets/logo/krion.png" alt="Krion Logo" class="logo-image">
        </div>
        <h1 class="app-title">Design QC</h1>
      </div>
      <p class="login-subtitle">Welcome back! Please sign in to your account.</p>
    </div>

    <!-- Error message display -->
    <div *ngIf="errorMessage" class="error-message">
      {{ errorMessage }}
    </div>

    <form class="login-form" (ngSubmit)="onSubmit()" #loginForm="ngForm">
      <div class="form-group">
        <label for="username" class="form-label">Username</label>
        <div class="input-wrapper">
          <div class="input-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M20 21V19C20 17.9391 19.5786 16.9217 18.8284 16.1716C18.0783 15.4214 17.0609 15 16 15H8C6.93913 15 5.92172 15.4214 5.17157 16.1716C4.42143 16.9217 4 17.9391 4 19V21M16 7C16 9.20914 14.2091 11 12 11C9.79086 11 8 9.20914 8 7C8 4.79086 9.79086 3 12 3C14.2091 3 16 4.79086 16 7Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <input 
            type="text" 
            id="username" 
            name="username"
            [(ngModel)]="loginData.username"
            class="form-input"
            placeholder="Enter your username"
            required
            autocomplete="username">
        </div>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <div class="input-wrapper">
          <div class="input-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2" stroke="currentColor" stroke-width="2"/>
              <circle cx="12" cy="16" r="1" stroke="currentColor" stroke-width="2"/>
              <path d="M7 11V7C7 5.67392 7.52678 4.40215 8.46447 3.46447C9.40215 2.52678 10.6739 2 12 2C13.3261 2 14.5979 2.52678 15.5355 3.46447C16.4732 4.40215 17 5.67392 17 7V11" stroke="currentColor" stroke-width="2"/>
            </svg>
          </div>
          <input 
            [type]="showPassword ? 'text' : 'password'" 
            id="password" 
            name="password"
            [(ngModel)]="loginData.password"
            class="form-input"
            placeholder="Enter your password"
            required
            autocomplete="current-password">
          <button 
            type="button" 
            class="password-toggle"
            (click)="togglePasswordVisibility()">
            <svg *ngIf="!showPassword" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M1 12S5 4 12 4S23 12 23 12S19 20 12 20S1 12 1 12Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/>
            </svg>
            <svg *ngIf="showPassword" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M17.94 17.94C16.2306 19.243 14.1491 19.9649 12 20C5 20 1 12 1 12C2.24389 9.68192 3.96914 7.65661 6.06 6.06M9.9 4.24C10.5883 4.0789 11.2931 3.99836 12 4C19 4 23 12 23 12C22.393 13.1356 21.6691 14.2048 20.84 15.19M14.12 14.12C13.8454 14.4148 13.5141 14.6512 13.1462 14.8151C12.7782 14.9791 12.3809 15.0673 11.9781 15.0744C11.5753 15.0815 11.1747 15.0074 10.8019 14.8565C10.4291 14.7056 10.0917 14.4811 9.80385 14.1962C9.51597 13.9113 9.29326 13.5778 9.14684 13.2084C9.00042 12.8389 8.93289 12.4415 8.94833 12.0407C8.96377 11.6399 9.06201 11.2441 9.23706 10.8817C9.41211 10.5193 9.66047 10.1991 9.96448 9.93969C10.2685 9.68024 10.6218 9.48751 11 9.374M1 1L23 23" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="form-group">
        <!-- <div class="remember-me">
          <label class="checkbox-label">
            <input 
              type="checkbox" 
              [(ngModel)]="rememberMe"
              name="rememberMe"
              class="checkbox-input">
            <span class="checkbox-custom"></span>
            Remember me
          </label>
        </div> -->
      </div>

      <div class="form-actions">
        <button 
          type="submit" 
          class="login-button"
          [disabled]="isLoading || !loginForm.form.valid">
          <span *ngIf="!isLoading">Sign In</span>
          <div *ngIf="isLoading" class="loading-spinner">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 2V6M12 18V22M4.93 4.93L7.76 7.76M16.24 16.24L19.07 19.07M2 12H6M18 12H22M4.93 19.07L7.76 16.24M16.24 7.76L19.07 4.93" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>Signing In...</span>
          </div>
        </button>
      </div>
    </form>

    <div class="login-footer">
      <!-- <p class="footer-text">Don't have an account? <a href="#" class="footer-link">Sign up</a></p> -->
      <!-- <p class="footer-text"><a href="#" class="footer-link">Forgot your password?</a></p> -->
    </div>
  </div>
</div> 

<!-- Success Modal -->
<app-success-modal
  [isVisible]="showSuccessModal"
  [userData]="userData"
  (connect)="onConnect()"
  (close)="onCloseModal()">
</app-success-modal>

<!-- Sync Modal -->
<app-sync-modal
  [isVisible]="showSyncModal"
  [accUserId]="accUserId"
  (sync)="onSync($event)"
  (close)="onCloseSyncModal()">
</app-sync-modal>

<!-- Autodesk Loading -->
<app-autodesk-loading
  [isVisible]="showAutodeskLoading"
  message="Please complete the authentication in the popup window. After closing the popup, we'll wait 5 seconds before checking the status..."
  (manualCheck)="onManualCheck()">
</app-autodesk-loading>
